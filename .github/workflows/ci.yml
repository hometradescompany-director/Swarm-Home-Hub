name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exact Bun lockfile
        run: bun install --frozen-lockfile
      - name: Use npm 11 resolver for advisory lookup only
        run: npm install -g npm@11.19.1
      - name: Dependency audit
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if npm audit --audit-level=moderate 2>&1 | tee "$log"; then
              exit 0
            fi

            if grep -Eq "503 Service Unavailable|performing maintenance|audit endpoint returned an error" "$log"; then
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi
              echo "::warning::npm audit infrastructure unavailable after 3 attempts; dependency advisory status is unknown, not clean"
              exit 0
            fi

            exit 1
          done
      - name: Residence phase contract
        run: bun run test:residence-phase
      - run: bun run check
