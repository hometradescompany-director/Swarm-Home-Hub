name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm 11 resolver
        run: npm install -g npm@11.19.1
      - run: npm install
      - name: Capture dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Dependency audit diagnostics
        run: npm audit --json || true
      - run: npm run check
