name: demo-smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "scripts/demo.mjs"
      - "scripts/proof.mjs"
      - "docs/DEMO.md"
      - "docs/BUYER-PROOF.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/demo-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/demo.mjs"
      - "scripts/proof.mjs"
      - "docs/DEMO.md"
      - "docs/BUYER-PROOF.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/demo-smoke.yml"
  workflow_dispatch:

jobs:
  buyer-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Use npm 11 resolver
        run: npm install -g npm@11.19.1
      - run: npm ci
      - name: Run one-command buyer proof
        run: npm run proof | tee buyer-proof.json
      - name: Publish proof in workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Swarm Home Hub buyer proof'
            echo
            echo '```json'
            cat buyer-proof.json 2>/dev/null || echo '{"ok":false,"error":"proof report unavailable"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
