name: demo-smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "scripts/demo.mjs"
      - "scripts/play.mjs"
      - "scripts/play-ui.mjs"
      - "scripts/play-smoke.mjs"
      - "scripts/play-receipt.mjs"
      - "docs/DEMO.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/demo-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/demo.mjs"
      - "scripts/play.mjs"
      - "scripts/play-ui.mjs"
      - "scripts/play-smoke.mjs"
      - "scripts/play-receipt.mjs"
      - "docs/DEMO.md"
      - "docs/GREAT_BUN.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/demo-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exact Bun lockfile
        run: bun install --frozen-lockfile
      - name: Compile TypeScript
        run: bunx tsc
      - name: Prove compiled playable Bun
        run: bun run prove:playable
      - name: Upload compiled playable + provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: swarm-home-playable-bun-${{ github.sha }}
          path: |
            dist/swarm-home-bun
            dist/playable-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Boot bounded demo host
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/demo.mjs >/tmp/swarm-home-demo.log 2>&1 &
          echo $! >/tmp/swarm-home-demo.pid

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/swarm-home/health >/tmp/health.json; then
              exit 0
            fi
            sleep 0.5
          done

          cat /tmp/swarm-home-demo.log
          exit 1
      - name: Prove public read-only surface
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent             http://127.0.0.1:8787/swarm-home/health             | tee /tmp/health.json             | grep -q '"ok":true'

          curl --fail --silent             http://127.0.0.1:8787/swarm-home/tools             | tee /tmp/tools.json             | grep -q '"swarm.home.inspect"'

          curl --fail --silent             -X POST             -H 'content-type: application/json'             -d '{"arguments":{}}'             http://127.0.0.1:8787/swarm-home/tools/swarm.home.inspect             | tee /tmp/inspect.json             | grep -q '"ok":true'

          status="$(
            curl --silent --output /tmp/mutation.json --write-out '%{http_code}'               -X POST               -H 'content-type: application/json'               -d '{"arguments":{}}'               http://127.0.0.1:8787/swarm-home/tools/swarm.home.request
          )"

          test "$status" = "403"
          grep -q 'state-mutating tools require a transport admission guard' /tmp/mutation.json
      - name: Stop demo host
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/swarm-home-demo.pid ]; then
            kill "$(cat /tmp/swarm-home-demo.pid)" 2>/dev/null || true
          fi
          cat /tmp/swarm-home-demo.log 2>/dev/null || true
