name: bun-compat

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/bun-compat.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/bun-compat.yml"
  workflow_dispatch:

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install for compatibility proof
        run: bun install
      - name: Run Bun-native typecheck and tests
        run: bun run check:bun
      - name: Require generated Bun lock
        run: test -f bun.lock
      - name: Commit candidate Bun lock to this sprint branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already matches the tested dependency graph"
            exit 0
          fi
          git commit -m "BUN: commit tested Bun lockfile"
          git push origin HEAD:${{ github.head_ref }}
