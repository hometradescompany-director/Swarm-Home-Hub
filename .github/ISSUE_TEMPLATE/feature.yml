name: Feature proposal
description: Propose a bounded capability without creating a parallel truth or authority path.
title: "[Proposal] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should be solved?
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing surface
      description: What existing module, contract, or tool could be extended?
  - type: textarea
    id: boundary
    attributes:
      label: Proposed boundary
      description: What would it own, know, emit, and relate to?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Observable success
      description: What evidence would prove this is useful and correct?
