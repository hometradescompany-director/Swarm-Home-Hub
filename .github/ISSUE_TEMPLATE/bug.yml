name: Bug report
description: Report a reproducible defect without posting secrets or private data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, private residence data, or security exploit details here. Use the security policy for sensitive reports.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit SHA
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic/non-sensitive data.
